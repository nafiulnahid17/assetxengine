name: AssetsX AI Engine checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install system EPS conversion
        run: sudo apt-get update && sudo apt-get install -y inkscape ghostscript fonts-dejavu-core
      - run: python -m pip install '.[test]'
      - run: python -m pytest -q
      - run: python -m compileall -q assetsx_engine
