[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-jersey-assetsx-engine"
version = "0.1.0"
description = "AssetsX AI universal visual asset editing and vectorization backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1", "uvicorn>=0.27,<1", "python-multipart>=0.0.20,<1",
  "pillow>=10,<13", "numpy>=1.26,<3", "opencv-python-headless>=4.8,<5",
  "pymupdf>=1.24,<2", "cairosvg>=2.7,<3", "defusedxml>=0.7,<1",
  "fonttools>=4.50,<5", "httpx>=0.27,<1",
  "vtracer>=0.6,<1", "pytesseract>=0.3.10,<1",
]

[project.optional-dependencies]
trace = ["vtracer>=0.6,<1"]
test = ["pytest>=8,<10"]

[project.scripts]
assetsx-server = "assetsx_engine.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["assetsx_engine*"]

[tool.pytest.ini_options]
testpaths=["tests"]
